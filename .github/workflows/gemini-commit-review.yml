name: Gemini Commit Review

on:
  push:
    branches:
      - main
    paths:
      - 'Assets/02.Scripts/**/*.cs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gemini-commit-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  review:
    name: Review C# commit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create commit diff
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if git rev-parse "${COMMIT_SHA}^" > /dev/null 2>&1; then
            git diff \
              --no-ext-diff \
              --unified=80 \
              "${COMMIT_SHA}^" \
              "${COMMIT_SHA}" \
              -- ':(glob)Assets/02.Scripts/**/*.cs' > commit.diff
          else
            git show \
              --format= \
              --no-ext-diff \
              --unified=80 \
              "${COMMIT_SHA}" \
              -- ':(glob)Assets/02.Scripts/**/*.cs' > commit.diff
          fi

          if [[ ! -s commit.diff ]]; then
            echo "Assets/02.Scripts에서 리뷰할 C# 변경사항이 없습니다."
            exit 1
          fi

      # 1순위: Gemini 3 Flash
      - name: Run Gemini review
        id: gemini_review
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3-flash-preview
          prompt: |
            현재 저장소의 최신 커밋을 코드 리뷰하세요.

            반드시 먼저 commit.diff 파일을 읽고,
            Assets/02.Scripts 폴더에 포함된 C# 변경사항을 검토하세요.

            저장소의 GEMINI.md에 있는
            코드 리뷰 기준을 반드시 적용하세요.

            변경된 코드의 버그, 예외 가능성, Unity 생명주기 문제,
            성능 문제, 메모리 할당, 설계 및 가독성을 검토하세요.

            변경사항과 직접 관련된 문제를 우선하고,
            근거가 약한 추측이나 과도한 리팩터링 제안은 피하세요.

            파일을 수정하거나 Commit하지 말고
            리뷰 결과만 한국어로 작성하세요.

      - name: Save Gemini review
        if: ${{ steps.gemini_review.outcome == 'success' && steps.gemini_review.outputs.summary != '' }}
        shell: bash
        env:
          REVIEW_BODY: ${{ steps.gemini_review.outputs.summary }}
        run: |
          printf '%s\n' "${REVIEW_BODY}" > review.txt
          echo "REVIEW_MODEL=Gemini 3 Flash" >> "${GITHUB_ENV}"

      # 2순위: Groq GPT-OSS 20B
      - name: Run Groq fallback review
        id: groq_review
        if: ${{ steps.gemini_review.outcome == 'failure' || steps.gemini_review.outputs.summary == '' }}
        continue-on-error: true
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          RULES=""

          if [[ -f GEMINI.md ]]; then
            RULES="$(cat GEMINI.md)"
          fi

          jq -n \
            --rawfile diff commit.diff \
            --arg rules "${RULES}" \
            '{
              model: "openai/gpt-oss-20b",
              messages: [
                {
                  role: "system",
                  content: "당신은 Unity C# 코드 리뷰어입니다. 리뷰 결과는 반드시 한국어로 작성하세요."
                },
                {
                  role: "user",
                  content: (
                    "다음 최신 커밋의 C# 변경사항을 코드 리뷰하세요.\n\n" +
                    "코드 리뷰 기준:\n" + $rules + "\n\n" +
                    "변경사항:\n" + $diff + "\n\n" +
                    "버그, 예외 가능성, Unity 생명주기 문제, 성능 문제, " +
                    "메모리 할당, 설계 및 가독성을 검토하세요.\n" +
                    "변경사항과 직접 관련된 문제를 우선하고, " +
                    "근거가 약한 추측이나 과도한 리팩터링 제안은 피하세요."
                    "가독성을 위해 중복 언급은 금지합니다."
                  )
                }
              ]
            }' > groq-request.json

          curl --fail-with-body -sS \
            "https://api.groq.com/openai/v1/chat/completions" \
            -H "Authorization: Bearer ${GROQ_API_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary @groq-request.json \
            > groq-response.json

          jq -e -r '.choices[0].message.content' \
            groq-response.json > review.txt

          if [[ ! -s review.txt ]]; then
            echo "Groq 리뷰 결과가 비어 있습니다."
            exit 1
          fi

          echo "REVIEW_MODEL=Groq GPT-OSS 20B" >> "${GITHUB_ENV}"

      - name: Add review to Actions summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Commit Review"
            echo
            echo "**Model: ${REVIEW_MODEL:-리뷰 생성 실패}**"
            echo

            if [[ -s review.txt ]]; then
              cat review.txt
            else
              echo "리뷰 결과가 생성되지 않았습니다."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Post review on commit
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [[ ! -s review.txt ]]; then
            echo "게시할 리뷰가 없습니다."
            exit 0
          fi

          REVIEW_BODY="$(cat review.txt)"

          jq -n \
            --arg body "## Commit Review

          **Model: ${REVIEW_MODEL}**

          ${REVIEW_BODY}" \
            '{body: $body}' > comment.json

          gh api \
            --method POST \
            "/repos/${REPOSITORY}/commits/${COMMIT_SHA}/comments" \
            --input comment.json

      - name: Fail if all reviewers failed
        if: always()
        shell: bash
        run: |
          if [[ ! -s review.txt ]]; then
            echo "Gemini와 Groq 모두 코드 리뷰 생성에 실패했습니다."
            exit 1
          fi