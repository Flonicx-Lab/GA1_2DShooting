name: AI Commit Review

on:
  push:
    branches:
      - main
    paths:
      - 'Assets/02.Scripts/**/*.cs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-commit-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  review:
    name: Review C# commit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create commit diff
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if git rev-parse "${COMMIT_SHA}^" > /dev/null 2>&1; then
            git diff \
              --no-ext-diff \
              --unified=80 \
              "${COMMIT_SHA}^" \
              "${COMMIT_SHA}" \
              -- ':(glob)Assets/02.Scripts/**/*.cs' > commit.diff
          else
            git show \
              --format= \
              --no-ext-diff \
              --unified=80 \
              "${COMMIT_SHA}" \
              -- ':(glob)Assets/02.Scripts/**/*.cs' > commit.diff
          fi

          if [[ ! -s commit.diff ]]; then
            echo "Assets/02.Scripts에서 리뷰할 C# 변경사항이 없습니다."
            exit 1
          fi

      - name: Build review prompt
        shell: bash
        run: |
          rm -f review.txt

          {
            echo "당신은 Unity C# 코드 리뷰어입니다."
            echo "리뷰 결과는 반드시 한국어로 작성하세요."
            echo
            echo "현재 저장소의 최신 커밋에 포함된 C# 변경사항을 코드 리뷰하세요."
            echo
            echo "변경된 코드의 버그, 예외 가능성, Unity 생명주기 문제,"
            echo "성능 문제, 메모리 할당, 설계 및 가독성을 검토하세요."
            echo
            echo "변경사항과 직접 관련된 문제를 우선하고,"
            echo "근거가 약한 추측이나 과도한 리팩터링 제안은 피하세요."
            echo "가독성을 위해 중복 언급은 금지합니다."
            echo
            echo "=== 코드 리뷰 기준 ==="

            if [[ -f GEMINI.md ]]; then
              cat GEMINI.md
            else
              echo "별도의 GEMINI.md 기준이 없습니다."
            fi

            echo
            echo "=== 이번 커밋의 C# 변경사항 ==="
            cat commit.diff
          } > review-prompt.txt

      # 1순위: Gemini 3.1 Flash-Lite
      - name: Run Gemini review
        id: gemini_review
        continue-on-error: true
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [[ -z "${GEMINI_API_KEY}" ]]; then
            echo "GEMINI_API_KEY가 없습니다."
            exit 1
          fi

          jq -n \
            --rawfile prompt review-prompt.txt \
            '{
              contents: [
                {
                  role: "user",
                  parts: [
                    {
                      text: $prompt
                    }
                  ]
                }
              ],
              generationConfig: {
                maxOutputTokens: 8192
              }
            }' > gemini-request.json

          HTTP_STATUS="$(curl -sS \
            -o gemini-response.json \
            -w "%{http_code}" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent" \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary @gemini-request.json)"

          if [[ ! "${HTTP_STATUS}" =~ ^2[0-9][0-9]$ ]]; then
            ERROR_MESSAGE="$(
              jq -r '.error.message // empty' gemini-response.json 2>/dev/null || true
            )"

            echo "Gemini API 실패 (${HTTP_STATUS}): ${ERROR_MESSAGE:-알 수 없는 오류}"
            exit 1
          fi

          if ! jq -e . gemini-response.json > /dev/null 2>&1; then
            echo "Gemini 응답이 올바른 JSON이 아닙니다."
            exit 1
          fi

          REVIEW_BODY="$(
            jq -r '
              [
                .candidates[0].content.parts[]?
                | select(.text != null and ((.thought // false) == false))
                | .text
              ]
              | join("")
            ' gemini-response.json
          )"

          if [[ -z "$(printf '%s' "${REVIEW_BODY}" | tr -d '[:space:]')" ]]; then
            FINISH_REASON="$(
              jq -r '.candidates[0].finishReason // "unknown"' gemini-response.json
            )"

            echo "Gemini 응답 본문이 비어 있습니다."
            echo "finishReason: ${FINISH_REASON}"
            exit 1
          fi

          printf '%s\n' "${REVIEW_BODY}" > review.txt
          echo "REVIEW_MODEL=Gemini 3.1 Flash-Lite" >> "${GITHUB_ENV}"

      # 2순위: Groq GPT-OSS 20B
      - name: Run Groq fallback review
        id: groq_review
        if: ${{ always() && steps.gemini_review.outcome != 'success' }}
        continue-on-error: true
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          rm -f review.txt

          if [[ -z "${GROQ_API_KEY}" ]]; then
            echo "GROQ_API_KEY가 없습니다."
            exit 1
          fi

          jq -n \
            --rawfile prompt review-prompt.txt \
            '{
              model: "openai/gpt-oss-20b",
              reasoning_effort: "low",
              include_reasoning: false,
              max_completion_tokens: 8192,
              stream: false,
              messages: [
                {
                  role: "user",
                  content: $prompt
                }
              ]
            }' > groq-request.json

          HTTP_STATUS="$(curl -sS \
            -o groq-response.json \
            -w "%{http_code}" \
            "https://api.groq.com/openai/v1/chat/completions" \
            -H "Authorization: Bearer ${GROQ_API_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary @groq-request.json)"

          if [[ ! "${HTTP_STATUS}" =~ ^2[0-9][0-9]$ ]]; then
            ERROR_MESSAGE="$(
              jq -r '.error.message // empty' groq-response.json 2>/dev/null || true
            )"

            echo "Groq API 실패 (${HTTP_STATUS}): ${ERROR_MESSAGE:-알 수 없는 오류}"
            exit 1
          fi

          if ! jq -e . groq-response.json > /dev/null 2>&1; then
            echo "Groq 응답이 올바른 JSON이 아닙니다."
            exit 1
          fi

          REVIEW_BODY="$(
            jq -r '.choices[0].message.content // ""' groq-response.json
          )"

          if [[ -z "$(printf '%s' "${REVIEW_BODY}" | tr -d '[:space:]')" ]]; then
            FINISH_REASON="$(
              jq -r '.choices[0].finish_reason // "unknown"' groq-response.json
            )"

            echo "Groq 응답 본문이 비어 있습니다."
            echo "finish_reason: ${FINISH_REASON}"
            exit 1
          fi

          printf '%s\n' "${REVIEW_BODY}" > review.txt
          echo "REVIEW_MODEL=Groq GPT-OSS 20B" >> "${GITHUB_ENV}"

      - name: Add review to Actions summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Commit Review"
            echo
            echo "**Model: ${REVIEW_MODEL:-리뷰 생성 실패}**"
            echo

            if [[ -s review.txt ]] &&
               grep -q '[^[:space:]]' review.txt; then
              cat review.txt
            else
              echo "리뷰 결과가 생성되지 않았습니다."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Post review on commit
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [[ ! -s review.txt ]] ||
             ! grep -q '[^[:space:]]' review.txt; then
            echo "게시할 리뷰가 없습니다."
            exit 0
          fi

          REVIEW_BODY="$(cat review.txt)"

          jq -n \
            --arg body "## Commit Review

          **Model: ${REVIEW_MODEL}**

          ${REVIEW_BODY}" \
            '{body: $body}' > comment.json

          gh api \
            --method POST \
            "/repos/${REPOSITORY}/commits/${COMMIT_SHA}/comments" \
            --input comment.json

      - name: Fail if all reviewers failed
        if: always()
        shell: bash
        run: |
          if [[ ! -s review.txt ]] ||
             ! grep -q '[^[:space:]]' review.txt; then
            echo "Gemini와 Groq 모두 코드 리뷰 생성에 실패했습니다."
            exit 1
          fi